[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project2pdf"
version = "0.1.0"
description = "Turn 3D-print project files and model links into durable, source-linked PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "Jinja2>=3.1",
  "Pillow>=10.4",
  "pypdf>=5.0",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.9",
  "pyinstaller>=6.11",
]

[project.scripts]
project2pdf = "project2pdf.cli:main"
project2pdf-gui = "project2pdf.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project2pdf = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

